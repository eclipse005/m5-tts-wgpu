[package]
name = "m5-tts-wgpu"
version = "0.1.0"
edition = "2021"
description = "M5-TTS 50M speech synthesis in Rust — wgpu GPU and hand-written CPU inference"
license = "Apache-2.0"

[lib]
name = "m5_tts_wgpu"
path = "src/lib.rs"

[[bin]]
name = "m5-tts"
path = "src/main.rs"

[dependencies]
# Vulkan/GL/Metal only; see ming-3.0-tts-wgpu for why dx12 is dropped.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "gles", "vulkan", "wgsl", "webgpu"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
safetensors = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hound = "3"
tokenizers = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
fancy-regex = "0.20.0"
rustfst = "1.3.1"
rayon = "1.10"
half = "2"

[profile.release]
opt-level = 3
lto = "thin"
